[package]
name = "aegis-measure"
default-run = "aegis-measure"
version = "0.3.12"
edition.workspace = true
license.workspace = true
description = "AEGIS-NDR measurement artifact helpers"
build = "build.rs"

[[bin]]
name = "aegis-measure"
path = "src/main.rs"

[[bin]]
name = "aegis-research-measure"
path = "src/research_main.rs"

[dependencies]
aegis-core = { version = "0.3.50", path = "../../aegis-core" }
clap.workspace = true
md5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring = "=0.17.14"
pem = "=3.0.6"
socket2 = "0.6"
tokio.workspace = true
toml.workspace = true
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
rcgen.workspace = true
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
