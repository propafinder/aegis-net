[package]
name = "aegis-transport-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local research fixtures for independent Aegis ingress; no production transport claims"
publish = false

[dependencies]
aegis-core = { version = "0.3.50", path = "../../aegis-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
http.workspace = true
h2.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
thiserror.workspace = true

[dev-dependencies]
# tests/source_regressions.rs compiles aegis-client's relay/policy.rs, which
# reads the Chrome User-Agent from the shared profile crate.
aegis-chrome-profile = { version = "0.3.50", path = "../../aegis-chrome-profile" }
rcgen.workspace = true
tempfile = "3"
hex.workspace = true
rand.workspace = true
