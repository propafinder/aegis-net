# Installed only by the explicit relay-geneva-profile command.
[Service]
User=root
Group=root
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET
RuntimeDirectory=aegis-relay-geneva
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
ReadWritePaths=/run/aegis-relay-geneva /var/lib/aegis-install/client
Restart=no
TimeoutStopSec=25s
ExecStartPre=/bin/bash /usr/local/lib/aegis/aegis-relay-geneva-profile.sh recover
