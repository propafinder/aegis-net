# AEGIS forensic-safe client profile — for hostile / seizable hosts (journalists,
# at-risk users). Drop into /etc/systemd/system/aegis-client.service.d/ then
# `systemctl daemon-reload && systemctl restart aegis-client`.
#
# AEGIS_FORENSIC_SAFE=1 makes the client (audit F1/F4):
#   - never write /var/log/aegis-client/runtime-events.jsonl (no on-disk history)
#   - emit only allowlisted event/error codes, never destination hashes or text
#   - keep the Brain state (strategy stats) RAM-only (no ~/.cache/aegis/state.json
#     activity map)
# Aegis tracing uses the private formatter too. OS/service-manager metadata is
# separate; packaging/journald/forensic.conf can make its storage volatile.
# The runtime never enables SSLKEYLOGFILE, including diagnostic sessions.
[Service]
Environment=AEGIS_FORENSIC_SAFE=1
