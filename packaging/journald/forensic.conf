# AEGIS forensic journald profile — drop into /etc/systemd/journald.conf.d/ then
# `systemctl restart systemd-journald`. Storage=volatile limits NEW journal
# storage to RAM; it does not erase existing disk journals or other log files.
# Client: private logging normally redacts destinations; explicit diagnostic
# sessions and historical logs may contain them. The installed RUST_LOG=info
# severity filter does not itself enable detailed destination fields.
# Relay: a fronted socket peer is an edge, but trusted CF-Connecting-IP can
# identify the client to application/rate-limit handling. Private operational
# logs omit peer/error prose; explicit diagnostics may include sensitive data.
# Volatile journals do not remove CDN, application, backup or filesystem records.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
