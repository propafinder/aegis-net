[package]
name = "aegis-webrtc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Owned WebRTC reliable byte carrier with bounded signaling and relay admission"
build = "build.rs"

[dependencies]
webrtc = { version = "=0.21.0", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "=0.21.0", default-features = false }
tokio.workspace = true
tokio-rustls.workspace = true
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rand.workspace = true
vpx-rs = { version = "=0.2.1", optional = true }
base64 = { version = "=0.22.1", optional = true }
futures = { workspace = true, optional = true }
httparse = { version = "=1.10.1", optional = true }
prost = { version = "=0.14.4", optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = []
# Native libvpx is an explicit, separately qualified packaging dependency.
sfu-media-vp8 = ["dep:vpx-rs", "dep:base64", "dep:futures", "dep:httparse", "dep:prost", "dep:tokio-tungstenite"]

[dev-dependencies]
rustls.workspace = true
rcgen.workspace = true
aegis-core = { version = "0.3.50", path = "../aegis-core" }
tempfile.workspace = true
hex.workspace = true
turn = "=0.17.2"
turn-util = { package = "webrtc-util", version = "=0.17.1", default-features = false, features = ["conn", "vnet"] }
