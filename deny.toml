# Dependency policy, not release license clearance. See supply-chain-checks.md.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "Unicode-3.0"]
unused-allowed-license = "warn"
private = { ignore = false }
# MPL applies only to this filesystem-location helper; preserve its source notices.
exceptions = [
    { name = "option-ext", version = "=0.2.0", allow = ["MPL-2.0"] },
    # Optional VP8 FFI only: exact unmodified upstream source and source URL
    # are recorded in NOTICE; its full MPL text remains in THIRD-PARTY-NOTICES.
    { name = "env-libvpx-sys", version = "=5.1.3", allow = ["MPL-2.0"] },
    # Rust zlib implementation: preserve its Zlib notice in distributions.
    { name = "zlib-rs", version = "=0.6.7", allow = ["Zlib"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
